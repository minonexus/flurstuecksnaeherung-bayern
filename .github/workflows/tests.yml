name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths: ["werkzeug/**", "schema/**", "tests/**", "requirements.txt"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/
